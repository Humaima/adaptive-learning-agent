services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: adaptive_tutor
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@db:5432/adaptive_tutor
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: